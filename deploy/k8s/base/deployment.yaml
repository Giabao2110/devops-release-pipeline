apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-demo
  labels:
    app.kubernetes.io/name: release-demo
spec:
  replicas: 2
  revisionHistoryLimit: 5          # keeps old ReplicaSets so `kubectl rollout undo` has a target
  progressDeadlineSeconds: 60      # rollout is marked failed if new pods are not ready in time
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0            # never drop below desired capacity during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: release-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: release-demo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FAIL_MODE
              value: ""
            - name: SHUTDOWN_DELAY_SECONDS
              value: "2"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

# Scales on CPU. Needs metrics-server (not installed in kind by default, see README Limitations);
# without it the HPA reports <unknown> targets and keeps minReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: release-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: release-demo
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# Run: promtool test rules deploy/monitoring/prometheus/alerts_test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # 1 req/s succeeds and 1/6 req/s fails -> 14.3% errors for > 5 minutes.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="release-demo",route="/api/work",code="200"}'
        values: '0+60x20'
      - series: 'http_requests_total{job="release-demo",route="/api/work",code="500"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: ReleaseDemoHighErrorRate
        exp_alerts: []            # still inside the 5m "for" window
      - eval_time: 12m
        alertname: ReleaseDemoHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: release-demo 5xx ratio above 5%
              description: 14.29% of requests failed over the last 5 minutes.

  # Healthy traffic (0.5% errors) must not page anyone.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="release-demo",route="/api/work",code="200"}'
        values: '0+199x20'
      - series: 'http_requests_total{job="release-demo",route="/api/work",code="500"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ReleaseDemoHighErrorRate
        exp_alerts: []

  # Both pods stop answering scrapes.
  - interval: 1m
    input_series:
      - series: 'up{job="release-demo",pod="a"}'
        values: '1 1 0 0 0 0 0'
      - series: 'up{job="release-demo",pod="b"}'
        values: '1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: ReleaseDemoDown
        exp_alerts: []
      - eval_time: 5m
        alertname: ReleaseDemoDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No release-demo pod is being scraped successfully
              description: All release-demo targets are down or missing for 2 minutes.

  # deploy.sh pushes cumulative counters: 2 successes, then 2 rollbacks.
  - interval: 1m
    input_series:
      - series: 'release_deployments_total{job="release_pipeline",environment="kind",result="success"}'
        values: '1 2 2 2 2 2'
      - series: 'release_deployments_total{job="release_pipeline",environment="kind",result="rolled_back"}'
        values: '0 0 1 1 2 2'
      - series: 'release_deployments_total{job="release_pipeline",environment="kind",result="rollback_failed"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: DeploymentRolledBack
        exp_alerts: []
      - eval_time: 2m
        alertname: DeploymentRolledBack
        exp_alerts:
          - exp_labels:
              severity: info
              job: release_pipeline
              environment: kind
              result: rolled_back
            exp_annotations:
              summary: A deployment to kind was rolled back (rolled_back)
              description: Check the pipeline run and the deploy event log before re-releasing.
      - eval_time: 2m
        alertname: RollbackRateHigh   # 1/3 = 33% and 3 deploys -> fires
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: kind
            exp_annotations:
              summary: More than 30% of deployments to kind needed a rollback
      - eval_time: 1m
        alertname: RollbackRateHigh   # 0/2 -> quiet
        exp_alerts: []

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: pushgateway }
  template:
    metadata:
      labels: { app: pushgateway }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.4
          ports: [{ name: web, containerPort: 9091 }]
          readinessProbe: { httpGet: { path: /-/ready, port: web }, periodSeconds: 10 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
spec:
  selector: { app: pushgateway }
  ports: [{ name: web, port: 9091, targetPort: web }]

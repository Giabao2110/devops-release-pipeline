# Local lab only: reachable through `kubectl port-forward`, anonymous users get
# read-only Viewer access; the admin password comes from an optional Secret
# created by scripts/monitoring_up.sh (never committed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:13.3.1
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            # Found while troubleshooting an OOMKill (docs/troubleshooting/03-oomkilled-grafana.md):
            # Grafana downloads/updates bundled plugins at start-up. Not needed offline.
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/release-demo.json }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password, optional: true }
          ports: [{ name: web, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: web }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi } # 256Mi was OOMKilled at start-up
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: { app: grafana }
  ports: [{ name: web, port: 3000, targetPort: web }]
